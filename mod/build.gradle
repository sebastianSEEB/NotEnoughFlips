// Based on FabricMC/fabric-example-mod (branch 1.21.11), Mojang mappings.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "notenoughflips"
}

// the few lines that differ between Minecraft versions live in src/compat/<version>
sourceSets.main.java.srcDir "src/compat/mc1_21/java"

dependencies {
	// unit tests of the pricing checks (run by every build: a failing check fails the build)
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.3"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	def mcRange = project.findProperty("mc_range") ?: "~${project.minecraft_version}"
	inputs.property "version", version
	inputs.property "mcRange", mcRange
	filesMatching("fabric.mod.json") {
		expand "version": version, "mc_range": mcRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}
